  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signOut, onAuthStateChanged, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, setDoc, doc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, updateDoc, deleteDoc, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ====== এখানে তোমার firebaseConfig বসাও ======
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD40E1QifHt5xQU935KOtfzi1wORCgvJrk",
  authDomain: "friendschat-8a7fc.firebaseapp.com",
  projectId: "friendschat-8a7fc",
  storageBucket: "friendschat-8a7fc.firebasestorage.app",
  messagingSenderId: "14697970142",
  appId: "1:14697970142:web:137bb152271d8bd7fc454f",
  measurementId: "G-4YHFYRRCJG"
};
// ==============================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const $ = (id) => document.getElementById(id);
let me = null;
let currentRoom = null;
let unsubMsgs = null;
let otherUid = null;

// ---------- লগইন ----------
const showErr = (e) => { $("loginErr").textContent = e.message || String(e); };
$("gBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(showErr);
$("fBtn").onclick = () => signInWithPopup(auth, new FacebookAuthProvider()).catch(showErr);
$("pBtn").onclick = () => { $("phoneBox").style.display = "flex"; };

let confirmation = null;
$("sendOtp").onclick = async () => {
  try {
    if (!window.rv) window.rv = new RecaptchaVerifier(auth, "recaptcha", { size: "normal" });
    confirmation = await signInWithPhoneNumber(auth, $("phoneNum").value.trim(), window.rv);
    $("otpCode").classList.remove("hide");
    $("verifyOtp").classList.remove("hide");
  } catch (e) { showErr(e); }
};
$("verifyOtp").onclick = () => confirmation.confirm($("otpCode").value.trim()).catch(showErr);
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  me = user;
  if (user) {
    const name = user.displayName || user.phoneNumber || "বন্ধু";
    const uref = doc(db, "users", user.uid);
const usnap = await getDoc(uref);
if (usnap.exists()) {
  await setDoc(uref, { uid: user.uid, lastSeen: serverTimestamp() }, { merge: true });
} else {
  await setDoc(uref, { uid: user.uid, name, photo: user.photoURL || "", lastSeen: serverTimestamp() }, { merge: true });
}
    $("login").classList.add("hide");
    $("main").classList.remove("hide");
    loadChats();
    loadStories();
    listenIncoming();
  } else {
    $("login").classList.remove("hide");
    $("main").classList.add("hide");
    $("room").classList.add("hide");
  }
});

// ---------- ট্যাব ----------
document.querySelectorAll(".tab").forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    t.classList.add("on");
    const isStory = t.dataset.t === "stories";
    $("chatsList").classList.toggle("hide", isStory);
    $("storiesList").classList.toggle("hide", !isStory);
    $("addStory").classList.toggle("hide", !isStory);
  };
});

function avatar(name, photo, ring) {
  const d = document.createElement("div");
  d.className = "av" + (ring ? " storyring" : "");
  if (photo) d.style.backgroundImage = `url(${photo})`;
  else { d.textContent = (name || "?")[0].toUpperCase(); d.style.background = "#075e54"; }
  return d;
}

// ===== নতুন চ্যাট তালিকা =====
let chatUsers = [];
const roomInfo = {};
const roomUnsub = {};
let usersUnsub = null;
let chatTick = null;

function roomIdFor(uid) { return [me.uid, uid].sort().join("_"); }
function lastReadOf(rid) { return Number(localStorage.getItem("lr_" + rid) || 0); }
function msOf(t) { return t && t.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }
function isOnlineUser(u) { const ms = msOf(u.lastSeen); return ms > 0 && Date.now() - ms < 60000; }
function timeLabel(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" });
  const y = new Date(now.getTime() - 86400000);
  if (d.toDateString() === y.toDateString()) return "গতকাল";
  return d.toLocaleDateString("bn-BD");
}

function watchRoom(rid) {
  if (roomUnsub[rid]) return;
  const q = query(collection(db, "rooms", rid, "messages"), orderBy("createdAt", "desc"), limit(30));
  roomUnsub[rid] = onSnapshot(q, (snap) => {
    const roomOpen = !$("room").classList.contains("hide") && currentRoom === rid;
    if (roomOpen) localStorage.setItem("lr_" + rid, String(Date.now()));
    const lr = lastReadOf(rid);
    let unread = 0;
    snap.docs.forEach((d) => {
      const m = d.data();
      const ms = msOf(m.createdAt) || Date.now();
      if (m.uid !== me.uid && ms > lr) unread++;
    });
    const m0 = snap.docs.length ? snap.docs[0].data() : null;
    roomInfo[rid] = m0 ? {
      text: m0.type === "image" ? "📷 ছবি" : m0.type === "voice" ? "🎤 ভয়েস মেসেজ" : (m0.text || ""),
      mine: m0.uid === me.uid,
      who: m0.name || "",
      ts: msOf(m0.createdAt) || Date.now(),
      unread: unread
    } : { text: "", mine: false, who: "", ts: 0, unread: 0 };
    renderChats();
  });
}

function makeRow(o) {
  const inf = o.info;
  const it = document.createElement("div");
  it.className = "item" + (inf.unread > 0 ? " unread" : "");
  const wrap = document.createElement("div");
  wrap.className = "avw";
  wrap.appendChild(avatar(o.name, o.photo));
  if (o.online) { const dot = document.createElement("div"); dot.className = "dot"; wrap.appendChild(dot); }
  const mid = document.createElement("div");
  mid.style.flex = "1";
  mid.style.minWidth = "0";
  const nm = document.createElement("div");
  nm.className = "nm";
  nm.textContent = o.name;
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.style.display = "none";
  const pv = document.createElement("div");
  pv.className = "pv";
  if (inf.text) {
    pv.textContent = (inf.mine ? "তুমি: " : (o.group && inf.who ? inf.who.split(" ")[0] + ": " : "")) + inf.text;
  } else if (o.online) {
    pv.textContent = "● অনলাইন";
    pv.style.color = "#25d366";
  } else {
    pv.textContent = o.group ? "সবাই এখানে" : "চ্যাট করো";
  }
  mid.appendChild(nm);
  mid.appendChild(sub);
  mid.appendChild(pv);
  const meta = document.createElement("div");
  meta.className = "meta";
  const tm = document.createElement("div");
  tm.className = "tm";
  tm.textContent = timeLabel(inf.ts);
  meta.appendChild(tm);
  if (inf.unread > 0) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = inf.unread > 99 ? "99+" : String(inf.unread);
    meta.appendChild(b);
  }
  it.appendChild(wrap);
  it.appendChild(mid);
  it.appendChild(meta);
  it.onclick = o.onclick;
  return it;
}

function renderChats() {
  const box = $("chatsList");
  if (!box || !me) return;
  const empty = { text: "", mine: false, who: "", ts: 0, unread: 0 };
  const rows = chatUsers.map((u) => ({ u: u, rid: roomIdFor(u.uid), online: isOnlineUser(u) }));
  rows.forEach((r) => { r.inf = roomInfo[r.rid] || empty; });
  rows.sort((a, b) =>
    (b.inf.unread > 0) - (a.inf.unread > 0) ||
    (b.online - a.online) ||
    (b.inf.ts - a.inf.ts) ||
    String(a.u.name).localeCompare(String(b.u.name)));
  box.innerHTML = "";
  rows.forEach((r) => {
    box.appendChild(makeRow({
      name: r.u.name || "বন্ধু", photo: r.u.photo, online: r.online, group: false, info: r.inf,
      onclick: () => openRoom(r.rid, r.u.name, r.u.uid)
    }));
  });
}

function loadChats() {
  if (usersUnsub) usersUnsub();
  Object.keys(roomUnsub).forEach((k) => { roomUnsub[k](); delete roomUnsub[k]; });
  watchRoom("group");
  usersUnsub = onSnapshot(collection(db, "users"), (snap) => {
    chatUsers = [];
    snap.forEach((d) => {
      const u = d.data();
      if (u.uid && u.uid !== me.uid) chatUsers.push(u);
    });
    chatUsers.forEach((u) => watchRoom(roomIdFor(u.uid)));
    renderChats();
  });
  if (!chatTick) chatTick = setInterval(renderChats, 15000);
}

new MutationObserver(() => {
  if (!$("room").classList.contains("hide") && currentRoom) {
    localStorage.setItem("lr_" + currentRoom, String(Date.now()));
    if (roomInfo[currentRoom]) roomInfo[currentRoom].unread = 0;
    renderChats();
  }
}).observe($("room"), { attributes: true, attributeFilter: ["class"] });
  
// ---------- চ্যাট রুম ----------
async function openRoom(roomId, name, other) {
  currentRoom = roomId;
  otherUid = other;
 $("roomHeader").onclick = async () => {
  if (!otherUid) return;

  try {
    const snap = await getDoc(doc(db, "users", otherUid));
    const u = snap.exists() ? snap.data() : {};

    let panel = document.getElementById("friendProfileView");
    if (panel) panel.remove();

    panel = document.createElement("div");
    panel.id = "friendProfileView";
    panel.style.cssText = `
      position:fixed;
      inset:0;
      z-index:99999;
      background:#fff;
      padding:25px;
      text-align:center;
      overflow:auto;
    `;

    const back = document.createElement("button");

  // ===================== কল (WebRTC) =====================
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };
let pc = null, localStream = null, callDocRef = null, callUnsubs = [], isVideoCall = true, inCall = false;

async function getMedia(video) {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = video ? "block" : "none";
}

function makePC() {
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  const remote = new MediaStream();
  $("remoteVideo").srcObject = remote;
  pc.ontrack = (e) => e.streams[0].getTracks().forEach((t) => remote.addTrack(t));
  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === "disconnected" || pc.connectionState === "failed")) endCall(false);
  };
}

async function startCall(video) {
  if (inCall) return;
  inCall = true;
  isVideoCall = video;
  try { await getMedia(video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = $("roomName").textContent + " কে কল করা হচ্ছে...";
  callDocRef = doc(collection(db, "calls"));
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(offerCands, e.candidate.toJSON()); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callDocRef, {
    from: me.uid, fromName: me.displayName || me.phoneNumber || "বন্ধু", to: otherUid,
    video, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, ts: Date.now()
  });
  callUnsubs.push(onSnapshot
    (callDocRef, async (s) => {
    const d = s.data();
    if (!d) return;
    if (d.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      $("callInfo").textContent = "কথা চলছে";
    }
    if (d.status === "ended" || d.status === "rejected") endCall(false);
  }));
  callUnsubs.push(onSnapshot(answerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
}

let incomingCall = null;
function listenIncoming() {
  const q = query(collection(db, "calls"), where("to", "==", me.uid), where("status", "==", "ringing"));
  onSnapshot(q, (snap) => {
    snap.docChanges().forEach((c) => {
      if (c.type === "added" && !inCall) {
        const d = c.doc.data();
        if (Date.now() - d.ts > 60000) return;
        incomingCall = { id: c.doc.id, data: d };
        $("incName").textContent = d.fromName + (d.video ? " ভিডিও কল করছে" : " অডিও কল করছে");
        $("incoming").classList.remove("hide");
      }
    });
  });
}

$("accept").onclick = async () => {
  $("incoming").classList.add("hide");
  const { id, data } = incomingCall;
  inCall = true;
  isVideoCall = data.video;
  try { await getMedia(data.video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = data.fromName;
  callDocRef = doc(db, "calls", id);
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(answerCands, e.candidate.toJSON()); };
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
  callUnsubs.push(onSnapshot(offerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
  callUnsubs.push(onSnapshot(callDocRef, (s) => {
    const d = s.data();
    if (d && d.status === "ended") endCall(false);
  }));
};

$("reject").onclick = async () => {
  $("incoming").classList.add("hide");
  if (incomingCall) await updateDoc(doc(db, "calls", incomingCall.id), { status: "rejected" });
};

async function endCall(notify = true) {
  if (notify && callDocRef) { try { await updateDoc(callDocRef, { status: "ended" }); } catch (e) {} }
  callUnsubs.forEach((u) => u());
  callUnsubs = [];
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("call").classList.add("hide");
  $("incoming").classList.add("hide");
  inCall = false;
  callDocRef = null;
}

// স্ক্রিন শেয়ার (ফোনের ব্রাউজারে সব সময় চলে না, কম্পিউটারে ভালো চলে)
let sharing = false;
$("shareBtn").onclick = async () => {
  if (!pc) return;
  if (!navigator.mediaDevices.getDisplayMedia) { alert("এই ডিভাইসে স্ক্রিন শেয়ার চলে না"); return; }
  const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
  try {
    if (!sharing) {
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const track = screen.getVideoTracks()[0];
      if (sender) await sender.replaceTrack(track);
      else pc.addTrack(track, screen);
      $("localVideo").srcObject = screen;
      sharing = true;
      track.onended = stopShare;
    } else { stopShare(); }
  } catch (e) {}
};
async function stopShare() {
  sharing = false;
  const cam = localStream && localStream.getVideoTracks()[0];
  const sender = pc && pc.getSenders().find((s) => s.track && s.track.kind === "video");
  if (sender && cam) await sender.replaceTrack(cam);
  $("localVideo").srcObject = localStream;
}

let recorder = null, chunks = [], recTimeout = null;
const mic = $("micBtn");
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      mic.classList.remove("rec");
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 700000) { alert("ভয়েস মেসেজ বেশি বড়, ছোট করে বলো"); return; }
      const reader = new FileReader();
      reader.onloadend = async () => {
        await addDoc(collection(db, "rooms", currentRoom, "messages"), {
          type: "voice", url: reader.result, text: "", uid: me.uid,
          name: me.displayName || me.phoneNumber || "বন্ধু", createdAt: serverTimestamp()
        });
      };
      reader.readAsDataURL(blob);
    };
    recorder.start();
    mic.classList.add("rec");
    recTimeout = setTimeout(stopRec, 20000);
  } catch (e) { alert("মাইকের অনুমতি দাও"); }
}
function stopRec() {
  clearTimeout(recTimeout);
  if (recorder && recorder.state === "recording") recorder.stop();
}
mic.addEventListener("touchstart", (e) => { e.preventDefault(); startRec(); }, { passive: false });
mic.addEventListener("touchend", stopRec);
mic.addEventListener("mousedown", startRec);

function lastSeenText(ts) {
  const ms = typeof ts === "number" ? ts : (ts && ts.toMillis ? ts.toMillis() : 0);
  if (!ms) return { online: false, text: "অফলাইন" };
  if (Date.now() - ms < 60000) return { online: true, text: "● অনলাইন" };
  const d = new Date(ms);
  const t = d.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" });
  const same = d.toDateString() === new Date().toDateString();
  const day = same ? "আজ " : d.toLocaleDateString("bn-BD") + " ";
  return { online: false, text: "সর্বশেষ দেখা " + day + t };
}

(function () {

    return ctx;
  }

    const c = getCtx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 425; g.gain.value = 0.12;
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + at); o.stop(c.currentTime + at + dur);
  }
  function pattern() { beep(0, 0.4); beep(0.6, 0.4); }
  setInterval(() => {
    const calling = !$("call").classList.contains("hide") && ($("callInfo").textContent || "").includes("কল করা হচ্ছে");

  // ===== নতুন চ্যাট (＋ বাটন) =====
(function () {
  const fab = document.createElement("button");
  fab.id = "newChatBtn";
  fab.textContent = "＋";
  $("main").appendChild(fab);

  function syncFab() { fab.style.display = $("chatsList").classList.contains("hide") ? "none" : "block"; }
  new MutationObserver(syncFab).observe($("chatsList"), { attributes: true, attributeFilter: ["class"] });
  syncFab();

  function ms(t) { return t && t.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }

  fab.onclick = async () => {
    if (document.getElementById("newChat")) return;
    const panel = document.createElement("div");
    panel.id = "newChat";
    const head = document.createElement("header");
    const back = document.createElement("button");
    back.textContent = "←";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "চ্যাট শুরু করো";
    head.appendChild(back);
    head.appendChild(title);
    const search = document.createElement("input");
    search.id = "ncSearch";
    search.placeholder = "বন্ধু খোঁজো...";
    const list = document.createElement("div");
    list.className = "ncList";
    panel.appendChild(head);
    panel.appendChild(search);
    panel.appendChild(list);
    $("app").appendChild(panel);
    back.onclick = () => panel.remove();
    list.textContent = "লোড হচ্ছে...";

    const users = [];
    try {
      const snap = await getDocs(collection(db, "users"));
      snap.forEach((d) => { const u = d.data(); if (u.uid && u.uid !== me.uid) users.push(u); });
    } catch (e) { list.textContent = "বন্ধুদের তালিকা আনা যায়নি"; return; }
    users.sort((a, b) => ms(b.lastSeen) - ms(a.lastSeen));

    function draw() {
      const q = search.value.trim().toLowerCase();
      list.textContent = "";
      const inv = $("inviteBtn");
      if (inv && !q) {
        const r = document.createElement("div");
        r.className = "item";
        const ic = document.createElement("div");
        ic.className = "av";
        ic.style.background = "#25d366";
        ic.textContent = "🔗";
        const t = document.createElement("div");
        t.className = "nm";
        t.textContent = "বন্ধুদের ইনভাইট করো";
        r.appendChild(ic);
        r.appendChild(t);
        r.onclick = () => { panel.remove(); inv.click(); };
        list.appendChild(r);
      }
      const shown = users.filter((u) => !q || String(u.name || "").toLowerCase().includes(q));
      if (!shown.length) {
        const p = document.createElement("div");
        p.className = "soon";
        p.textContent = "কাউকে পাওয়া যায়নি। বন্ধুকে ইনভাইট করো।";
        list.appendChild(p);
        return;
      }
      shown.forEach((u) => {
        const r = document.createElement("div");
        r.className = "item";
        r.appendChild(avatar(u.name, u.photo));
        const box = document.createElement("div");
        const nm = document.createElement("div");
        nm.className = "nm";
        nm.textContent = u.name || "বন্ধু";
        const sub = document.createElement("div");
        sub.className = "sub";
        const on = ms(u.lastSeen) > 0 && Date.now() - ms(u.lastSeen) < 60000;
        sub.textContent = u.bio ? u.bio : (on ? "● অনলাইন" : "চ্যাট করো");
        if (!u.bio && on) sub.style.color = "#25d366";
        box.appendChild(nm);
        box.appendChild(sub);
        r.appendChild(box);
        r.onclick = () => { panel.remove(); openRoom([me.uid, u.uid].sort().join("_"), u.name, u.uid); };
        list.appendChild(r);
      });
    }
    search.oninput = draw;
    draw();
  };
})();
  // ===== প্রোফাইল স্ক্রিন (WhatsApp স্টাইল) =====
(function () {
  const $ = (i) => document.getElementById(i);
  const prof = $("profile"), appEl = $("app");

  function sync() {
    const u = auth.currentUser;
    $("pWho").textContent = u ? (u.email || u.phoneNumber || "") : "";
    $("darkSub").textContent = appEl.classList.contains("dm") ? "Dark mode: On" : "Dark mode: Off";
  }
  new MutationObserver(() => { if (!prof.classList.contains("hide")) sync(); })
    .observe(prof, { attributes: true, attributeFilter: ["class"] });

  $("pEdit").onclick = () => { const n = $("pName"); n.focus(); n.select(); };

  function invite() {
    const url = location.origin + location.pathname;
    if (navigator.share) navigator.share({ title: "Friends Chat", text: "আমার সাথে Friends Chat-এ চ্যাট করো", url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert("লিংক কপি হয়েছে"));
    else prompt("এই লিংক বন্ধুকে পাঠাও", url);
  }
  $("pInv").onclick = invite;
  $("pInvX").onclick = (e) => { e.stopPropagation(); $("pInv").remove(); };

  $("rowPay").onclick = () => {
    const b = $("rupeeBtn");
    if (b) b.click(); else alert("Payments বাটন পাওয়া যায়নি");
  };

  $("rowDark").onclick = () => {
    const on = !appEl.classList.contains("dm");
    appEl.classList.toggle("dm", on);
    try { localStorage.setItem("darkmode", JSON.stringify(on)); } catch (e) {}
    sync();
  };

  $("rowInstall").onclick = () => {
    if (window.matchMedia("(display-mode: standalone)").matches) alert("অ্যাপ আগেই ইনস্টল করা আছে");
    else alert("Chrome-এর ⋮ মেনু খুলে 'Add to Home screen' বা 'Install app' চাপো");
  };

  $("rowLogout").onclick = () => {
    if (confirm("Logout করবে?")) { prof.classList.add("hide"); signOut(auth); }
  };
})();
 // ===== বন্ধুর প্রোফাইল (WhatsApp কন্ট্যাক্ট ইনফো স্টাইল) =====

  const P = {

    timer: "M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4a9 9 0 1 0 0 18 9 9 0 0 0 7.03-14.61zM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14z",

  const svg = (k) => '<svg viewBox="0 0 24 24"><path d="' + P[k] + '"/></svg>';

  // পুরনো প্রোফাইল প্যানেল এলে সরিয়ে দাও
  new MutationObserver(() => { const f = $("friendProfileView"); if (f) f.remove(); })
    .observe(document.body, { childList: true });

  // রুমের ⋮ মেনুর অপশন চালানো
  function viaMenu(re) {
    const mb = $("menuBtn");
    if (!mb) { alert("মেনু পাওয়া যায়নি"); return null; }
    mb.click();
    const menu = Array.from(roomEl.children).find((c) => c.style && c.style.zIndex === "50");
    const it = menu && Array.from(menu.children).find((d) => re.test(d.textContent.trim()));
    if (it) it.click();
    else { if (menu) menu.style.display = "none"; alert("এই অপশন পাওয়া যায়নি"); }
    return it || null;
  }
  function viaMore(re) {
    if (!viaMenu(/^More/)) return;
    setTimeout(() => {
      const p = $("wPanel");
      const body = p && p.children[1];
      const row = body && Array.from(body.children).find((r) => re.test(r.textContent.trim()));
      if (row) row.click(); else alert("এই অপশন পাওয়া যায়নি");
    }, 120);
  }

  header.addEventListener("click", async (e) => {
    if (!otherUid) return;
    e.stopImmediatePropagation();
    const old = $("cView"); if (old) old.remove();
    let u = {};
    try {
      const s = await getDoc(doc(db, "users", otherUid));
      if (s.exists()) u = s.data();
    } catch (er) {}
    build(u);
  }, true);

  function build(u) {
    const room = currentRoom;
    const uid = otherUid;
    const name = u.name || ($("roomName").textContent || "").trim() || "বন্ধু";
    const v = document.createElement("div");
    v.id = "cView";
    const close = () => v.remove();

    // উপরের বার
    const top = document.createElement("div");
    top.className = "cTop";
    top.innerHTML = '<span>←</span><span>⋮</span>';
    top.children[0].onclick = close;
    v.appendChild(top);

    // ছবি, নাম, বায়ো
    const hero = document.createElement("div");
    hero.className = "cHero";
    const av = document.createElement("div");
    av.className = "cAv";
    if (u.photo) av.style.backgroundImage = 'url("' + u.photo + '")';
    else av.textContent = name[0].toUpperCase();
    av.onclick = () => {
      if (!u.photo) return;
      const o = document.createElement("div");
      o.style.cssText = "position:absolute;inset:0;background:#000;z-index:45;display:flex;align-items:center;justify-content:center";
      const im = document.createElement("img");
      im.src = u.photo; im.style.cssText = "max-width:100%;max-height:100%";
      o.appendChild(im);
      o.onclick = () => o.remove();
      roomEl.appendChild(o);
    };
    const nm = document.createElement("div"); nm.className = "cName"; nm.textContent = name;
    const sb = document.createElement("div"); sb.className = "cSub"; sb.textContent = u.bio || "কোনো বায়ো নেই";
    hero.append(av, nm, sb);
    v.appendChild(hero);

    // ---------- Share ----------
    function share() {
      const url = location.origin + location.pathname;
      const text = name + (u.bio ? " - " + u.bio : "") + " | Friends Chat";
      if (navigator.share) navigator.share({ title: name, text, url }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text + " " + url).then(() => alert("কপি হয়েছে"));
      else prompt("কপি করো", text + " " + url);
    }

    // ---------- Pay ----------
    function pay() {
      const p = document.createElement("div");
      p.style.cssText = "position:absolute;inset:0;background:#fff;color:#111;z-index:45;padding:16px;overflow:auto";
      const hd = document.createElement("div");
      hd.style.cssText = "display:flex;align-items:center;gap:14px;font-size:20px;font-weight:bold;margin-bottom:18px";
      hd.innerHTML = '<span style="font-size:28px;cursor:pointer">←</span><span></span>';
      hd.children[1].textContent = "Pay " + name;
      hd.children[0].onclick = () => p.remove();
      const css = "width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:12px";
      const upi = document.createElement("input"); upi.placeholder = "UPI ID (যেমন name@upi)"; upi.style.cssText = css; upi.value = ls("upi_" + uid, "");
      const am = document.createElement("input"); am.placeholder = "টাকার অঙ্ক"; am.type = "number"; am.style.cssText = css;
      const nt = document.createElement("input"); nt.placeholder = "নোট (ঐচ্ছিক)"; nt.style.cssText = css;
      const hint = document.createElement("div");
      hint.style.cssText = "color:#667781;font-size:13px;margin-bottom:14px";
      hint.textContent = "UPI ID একবার দিলে এই বন্ধুর জন্য মনে থাকবে।";
      const go = document.createElement("button");
      go.textContent = "Pay";
      go.style.cssText = "width:100%;padding:14px;background:#1fa855;color:#fff;border:none;border-radius:8px;font-size:17px";
      go.onclick = () => {
        const a = upi.value.trim(), m = am.value.trim();
        if (!a || !a.includes("@")) { alert("সঠিক UPI ID লেখো"); return; }
        if (!m || isNaN(m) || Number(m) <= 0) { alert("টাকার অঙ্ক লেখো"); return; }
        lsSet("upi_" + uid, a);
        location.href = "upi://pay?pa=" + encodeURIComponent(a) + "&pn=" + encodeURIComponent(name) + "&am=" + encodeURIComponent(m) + "&tn=" + encodeURIComponent(nt.value.trim()) + "&cu=INR";
      };
      p.append(hd, upi, am, nt, hint, go);
      roomEl.appendChild(p);
    }

    // ---------- বাটনের সারি ----------
    const acts = document.createElement("div");
    acts.className = "cActs";
    [
      [svg("phone"), "Voice", () => { close(); $("acall").click(); }],
      [svg("video"), "Video", () => { close(); $("vcall").click(); }],
      ["₹", "Pay", pay],
      [svg("share"), "Share", share]
    ].forEach(([ic, lb, fn]) => {
      const a = document.createElement("div");
      a.className = "cAct";
      a.innerHTML = "<i>" + ic + "</i><span>" + lb + "</span>";
      a.onclick = fn;
      acts.appendChild(a);
    });
    v.appendChild(acts);

    // ---------- সারি বানানোর ফাংশন ----------
    function row(icon, title, sub, fn, red) {
      const r = document.createElement("div");
      r.className = "cRow" + (red ? " red" : "");
      r.innerHTML = svg(icon) + "<div><b></b><small></small></div>";
      r.querySelector("b").textContent = title;
      const s = r.querySelector("small");
      if (sub) s.textContent = sub; else s.remove();
      if (fn) r.onclick = fn;
      return r;
    }
    function section(rows) {
      const s = document.createElement("div");
      s.className = "cSec";
      rows.forEach((r) => s.appendChild(r));
      v.appendChild(s);
    }

    // বর্তমান অবস্থা
    let seen = "";
    try {
      const d = u.lastSeen && u.lastSeen.toDate ? u.lastSeen.toDate() : null;
      if (d) seen = d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    } catch (er) {}
    const mv = ls("mute_" + room, 0);
    const muted = mv === -1 || mv > Date.now();
    const dh = (ls("dis_" + room, { h: 0 }) || { h: 0 }).h;
    const disT = dh === 24 ? "24 hours" : dh === 168 ? "7 days" : "Off";
    const blocked = !!ls("block_" + room, false);

    section([
      row("clock", "Last seen", seen || "জানা নেই"),
      row("info", "About", u.bio || "কোনো বায়ো নেই")
    ]);
    section([
      row("bell", "Notifications", muted ? "Muted" : "On", () => viaMenu(/mute notifications/i)),
      row("image", "Media, links, and docs", "", () => viaMenu(/Media, links/i)),
      row("search", "Search in chat", "", () => viaMenu(/^Search/i)),
      row("timer", "Disappearing messages", disT, () => viaMenu(/Disappearing/i)),
      row("palette", "Chat theme", "", () => viaMenu(/Chat theme/i))
    ]);
    section([
      row("down", "Export chat", "", () => viaMore(/Export chat/i)),
      row("del", "Clear chat", "", () => viaMore(/Clear chat/i), true),
      row("block", blocked ? "Unblock " + name : "Block " + name, "", () => viaMore(/^(Block|Unblock)$/i), true)
    ]);

    // ---------- ⋮ মেনু ----------
    top.children[1].onclick = (e) => {
      e.stopPropagation();
      const old = $("cMenu"); if (old) { old.remove(); return; }
      const m = document.createElement("div");
      m.id = "cMenu";
      m.style.cssText = "position:absolute;top:52px;right:10px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:3;min-width:190px";
      [["Share contact", share], [blocked ? "Unblock" : "Block", () => viaMore(/^(Block|Unblock)$/i)]].forEach(([l, f]) => {
        const d = document.createElement("div");
        d.textContent = l; d.style.cssText = "padding:15px 20px;font-size:16px;cursor:pointer";
        d.onclick = () => { m.remove(); f(); };
        m.appendChild(d);
      });
      v.appendChild(m);
    };
    v.addEventListener("click", () => { const m = $("cMenu"); if (m) m.remove(); });

    roomEl.appendChild(v);
  }
})();

(function () {
  const root = document.getElementById("main");
  const BN = "০১২৩৪৫৬৭৮৯";
  const toEn = (s) => s.replace(/[০-৯]/g, (d) => BN.indexOf(d));
  const isTime = /^[\s০-৯0-9:.,\/\-]+(AM|PM|am|pm)?\s*$/;
  const MAP = {
    "চ্যাট করো": "Chat",
    "ভয়েস মেসেজ": "Voice message",
    "ছবি": "Photo",
    "ভিডিও": "Video",
    "স্টিকার": "Sticker",
    "ফাইল": "File",
    "গতকাল": "Yesterday",
    "আজ": "Today",
    "বন্ধু": "Friend",
    "বন্ধুদের ইনভাইট করো": "Invite friends",
    "লিংক পাঠিয়ে বন্ধুকে ডেকে আনো": "Share a link to invite friends",
   "কোনো স্টোরি নেই। + চাপলে নিজেরটা দাও।": "No stories yet. Tap + to add yours.", 
    "সার্চ করো...": "Search"
  };
  function fix(n) {
    const t = n.nodeValue;
    if (!/[\u0980-\u09FF]/.test(t)) return;
    const tr = t.trim();
    if (!tr) return;
    let out = t;
    if (isTime.test(tr)) {
      out = toEn(t);
    } else {
      let pre = "", rest = t;
      const mp = rest.match(/^(\s*)তুমি:\s*/);
      if (mp) { pre = mp[1] + "You: "; rest = rest.slice(mp[0].length); }
      const em = rest.match(/^[^\u0980-\u09FFA-Za-z0-9]*/)[0];
      const core = rest.slice(em.length).trim();
      if (MAP[core] !== undefined) out = pre + em + MAP[core];
      else if (mp) out = pre + rest;
    }
    if (out !== t) n.nodeValue = out;
  }

  function run() {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(fix);
  }

  let q = false;
  new MutationObserver(() => {
    if (q) return;
    q = true;
    requestAnimationFrame(() => { q = false; run(); });
  }).observe(root, { childList: true, subtree: true, characterData: true });
  run();
})();

  });

  let lastSent = 0, idle = null, typingRoom = "";
  function stopTyping() {
    clearTimeout(idle);

  }
  txt.addEventListener("input", () => {
    if (!otherUid) return;
    if (!txt.value.trim()) { stopTyping(); return; }

    if (typingRoom !== currentRoom || now - lastSent > 3000) {
      typingRoom = currentRoom;
      lastSent = now;
      put({ typingTo: currentRoom, typingAt: now });
    }
    clearTimeout(idle);
    idle = setTimeout(stopTyping, 4000);
  });
  $("form").addEventListener("submit", stopTyping, true);

  // ---------- বন্ধুর অবস্থা দেখা ----------
  let unsub = null, watching = null, data = null;
  function watch() {
    const target = otherUid || null;
    if (target === watching) return;
    watching = target;
    data = null;
    if (unsub) { unsub(); unsub = null; }
    if (target) {
      unsub = onSnapshot(doc(db, "users", target), (s) => {
        data = s.exists() ? s.data() : null;
        render();
      }, () => {});
    }
  }

  function fmt(ms) {
    const d = new Date(ms), n = new Date();
    const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(n) - day(d)) / 86400000);
    if (diff === 0) return "today at " + t;
    if (diff === 1) return "yesterday at " + t;
    return d.toLocaleDateString([], { day: "numeric", month: "short" }) + " at " + t;
  }

  function render() {
    if (!statusEl || !otherUid || !data) return;
    const now = Date.now();
    let s = "", color = "#667781";
    if (data.typingTo === currentRoom && now - (data.typingAt || 0) < 6000) {
      s = "typing..."; color = "#1fa855";
    } else if (data.online && now - (data.lastActive || 0) < 60000) {
      s = "Online"; color = "#1fa855";
    } else {
      let ms = data.lastActive || 0;
      if (!ms && data.lastSeen && data.lastSeen.toMillis) ms = data.lastSeen.toMillis();
      s = ms ? "Last seen " + fmt(ms) : "";
    }
    if (statusEl.textContent !== s) statusEl.textContent = s;
    statusEl.style.setProperty("color", color, "important");
  }

  setInterval(() => { watch(); render(); }, 1000);
})();
