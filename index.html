<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#111;height:100dvh;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:520px;height:100dvh;background:#efeae2;display:flex;flex-direction:column;position:relative}
.hide{display:none!important}
header{background:#075e54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header .title{flex:1;font-size:18px;font-weight:bold}
header button,.ibtn{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
#login{flex:1;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px}
#login h1{color:#075e54}
.lbtn{width:100%;max-width:300px;padding:13px;border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer}
.g{background:#db4437}.f{background:#1877f2}.p{background:#25d366}
#phoneBox{display:none;flex-direction:column;gap:8px;width:100%;max-width:300px}
#phoneBox input{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;background:#075e54}
.tab{flex:1;text-align:center;padding:12px;color:#b8d8d3;cursor:pointer;font-weight:bold;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:#fff}
.list{flex:1;overflow-y:auto;background:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:#bbb center/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.item .nm{font-weight:bold}.item .sub{font-size:13px;color:#777}
.storyring{border:3px solid #25d366}
#room{position:absolute;inset:0;background:#efeae2;display:flex;flex-direction:column;z-index:5}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.msg{max-width:78%;padding:7px 9px;border-radius:8px;background:#fff;align-self:flex-start;word-wrap:break-word}
.msg.me{background:#dcf8c6;align-self:flex-end}
.msg .n{font-size:12px;color:#075e54;font-weight:bold}
.msg .t{font-size:10px;color:#888;text-align:right;margin-top:2px}
.msg img,.msg video{max-width:100%;border-radius:6px;display:block}
.bar{display:flex;gap:6px;padding:8px;background:#f0f0f0;align-items:center}
.bar input[type=text]{flex:1;padding:11px;border:none;border-radius:20px;font-size:16px}
.bar button{background:#075e54;color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.bar label{font-size:24px;cursor:pointer;padding:0 4px}
#call{position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
#remoteWrap{flex:1;position:relative;background:#222}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;right:10px;top:10px;width:110px;border-radius:8px;border:2px solid #fff;background:#444}
#callInfo{position:absolute;top:12px;left:12px;color:#fff;font-size:18px}
.cbar{display:flex;justify-content:center;gap:16px;padding:16px;background:#111}
.cbar button{width:54px;height:54px;border-radius:50%;border:none;font-size:22px;cursor:pointer;background:#444;color:#fff}
.cbar .end{background:#e53935}
#incoming{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;color:#fff;font-size:22px}
#incoming .row{display:flex;gap:30px}
#incoming button{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;cursor:pointer}
#viewer{position:absolute;inset:0;background:#000;z-index:15;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
#viewer img,#viewer video{max-width:100%;max-height:80%}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#room{height:100dvh}
 /* ===== নতুন কল ডিজাইন ===== */
#call{background:linear-gradient(160deg,#1b1038,#0b1d3a 55%,#08242a)!important}
#remoteWrap{display:flex!important;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 104px!important;background:transparent!important}
#remoteVideo,#localVideo{position:static!important;top:auto!important;right:auto!important;left:auto!important;flex:1!important;min-height:0;width:100%!important;height:auto!important;object-fit:cover;border:none!important;border-radius:26px!important;background:#1d1d2b!important;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.45)}
#localVideo{transform:scaleX(-1)}
#callTop{background:none!important;padding:calc(env(safe-area-inset-top,0px) + 24px) 0 0!important;pointer-events:none}
#callName{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 20px;border-radius:30px;font-size:17px!important}
#callStatus{margin-top:8px;font-size:15px!important;letter-spacing:1px}
#audioFace{background:radial-gradient(circle at 50% 40%,#3a1f7a,#0b1d3a 70%)!important}
#audioAv{width:150px!important;height:150px!important;background:linear-gradient(135deg,#8b5cf6,#06b6d4)!important;font-size:64px!important;animation:pulseRing 2s infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(139,92,246,.55)}100%{box-shadow:0 0 0 46px rgba(139,92,246,0)}}
#call .cbar{left:50%!important;right:auto!important;transform:translateX(-50%);width:auto!important;max-width:94vw;background:rgba(255,255,255,.12)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:40px!important;padding:10px 14px!important;gap:10px!important}
#call .cbar button{width:50px!important;height:50px!important;border-radius:50%!important;background:rgba(255,255,255,.18)!important;font-size:21px!important}
#call .cbar #endBtn{width:70px!important;border-radius:30px!important;background:#ff3b5c!important}
#incoming{background:linear-gradient(160deg,#1b1038,#0b1d3a)!important}
#incoming button{box-shadow:0 0 0 10px rgba(255,255,255,.08)}
  #call{background:#0b141a}
#callInfo{display:none}
#callTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px;text-align:center;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3}
#callName{font-size:22px;font-weight:bold}
#callStatus{font-size:14px;opacity:.85;margin-top:4px}
#audioFace{position:absolute;inset:0;background:linear-gradient(#0b3d36,#0b141a);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2;color:#fff}
#audioFace.on{display:flex}
#audioAv{width:140px;height:140px;border-radius:50%;background:#075e54;display:flex;align-items:center;justify-content:center;font-size:60px}
#localVideo{width:100px!important;height:140px;object-fit:cover;border-radius:12px;top:84px!important;right:12px!important;z-index:4;transform:scaleX(-1)}
#remoteVideo{object-fit:cover}
#call .cbar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(30,30,30,.85);border-radius:36px;padding:12px;gap:12px;z-index:5}
#call .cbar button{width:52px;height:52px;font-size:22px}
#incoming{background:linear-gradient(#0b3d36,#0b141a)}
#incName{text-align:center;padding:0 20px;font-size:24px}
  #inviteBtn{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:#fff}
#inviteBtn .ic{width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#inviteBtn .invT{font-weight:bold;font-size:17px}
#inviteBtn .invS{font-size:14px;color:#667781} 
  #form{padding-bottom:60px!important}
  #form{padding-bottom:8px!important}
.bar{position:relative}
#bottomNav{padding-bottom:60px!important}
  .item .nm::after,.msg .n::after,#roomName.vb::after{content:"✔";display:inline-block;width:15px;height:15px;line-height:15px;font-size:10px;text-align:center;color:#fff;background:#1d9bf0;border-radius:50%;margin-left:5px;vertical-align:middle}
#chatsList .item:first-child .nm::after{display:none}
#profile{position:absolute;inset:0;height:100dvh;background:#fff;z-index:8;display:flex;flex-direction:column}
#profile .body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
#pAv{width:130px;height:130px;border-radius:50%;background:#075e54 center/cover;color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#profile input,#profile textarea{width:100%;max-width:360px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#profile label.l{align-self:flex-start;max-width:360px;width:100%;color:#075e54;font-size:13px;font-weight:bold;margin:0 auto}
#saveProfile{width:100%;max-width:360px;padding:13px;background:#25d366;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
/* ===== WhatsApp look ===== */
header{background:#fff!important;color:#111!important;padding:14px 16px!important}
header .title{color:#128c7e!important;font-size:24px!important;font-weight:bold}
header button,.ibtn{color:#111!important}
#room header{background:#075e54!important;color:#fff!important}
#room header .title{color:#fff!important;font-size:18px!important}
#room header button{color:#fff!important}
#searchWrap{padding:6px 14px 10px;background:#fff}
#searchBox{width:100%;padding:11px 16px;border:none;border-radius:24px;background:#f0f2f5;font-size:16px}
.tabs{display:none!important}
.list{background:#fff}
.item{padding:10px 16px!important;border-bottom:none!important}
.item .nm{font-size:17px}
.item .sub{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.item .meta{margin-left:auto;font-size:12px;color:#667781;align-self:flex-start;padding-top:4px}
#bottomNav{display:flex;background:#fff;border-top:1px solid #e5e5e5;padding:6px 0 10px}
#bottomNav div{flex:1;text-align:center;font-size:12px;color:#54656f;cursor:pointer}
#bottomNav div span{display:block;font-size:22px;margin:0 auto 2px;width:60px;border-radius:16px;padding:3px 0}
#bottomNav div.on{color:#111;font-weight:bold}
#bottomNav div.on span{background:#d9fdd3}
.fab{display:flex;align-items:center;justify-content:center;bottom:84px!important;border-radius:16px!important;background:#25d366!important}
.soon{padding:40px 20px;text-align:center;color:#667781;font-size:16px}
#statusRow{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0}
.stc{text-align:center;font-size:12px;color:#444;flex-shrink:0;cursor:pointer}
.stc .av{margin:0 auto 4px}
#delBar{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:30;padding:14px;display:flex;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#delBar button{flex:1;padding:13px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.tick{font-size:12px;color:#8696a0;margin-left:4px}
.tick.read{color:#34b7f1}
.dot{width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid #fff;position:absolute;right:0;bottom:0}
.avw{position:relative;flex-shrink:0}
#typing{padding:2px 14px;font-size:13px;color:#667781;background:#efeae2;min-height:20px}
.reply{background:rgba(0,0,0,.06);border-left:4px solid #25d366;border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:13px;color:#555}
.react{position:absolute;bottom:-12px;right:6px;background:#fff;border-radius:12px;padding:1px 6px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.msg{position:relative}
#replyBar{display:none;background:#f0f0f0;padding:6px 12px;border-left:4px solid #25d366;font-size:13px;justify-content:space-between}
#emojiBar{position:absolute;left:10px;right:10px;bottom:70px;background:#fff;border-radius:30px;padding:10px;display:flex;justify-content:space-around;font-size:26px;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#actBar{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:31;padding:10px;display:flex;gap:8px;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#actBar button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;background:#f0f0f0}
.voice audio{height:36px;max-width:220px}
#micBtn.rec{background:#e53935!important}
.bar{background:transparent!important}
.bar .pill{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:4px 14px}
.bar .pill input[type=text]{flex:1;background:transparent;padding:10px 4px}
.bar .pill .pic{padding:0;display:flex}
.bar button{width:48px;height:48px;background:#1fa855}
#header button svg{display:block}
#room header{align-items:center}
.bar #sendBtn.hide{display:none!important}
/* ===== WhatsApp চ্যাট লুক ===== */
#room header{background:#fff!important;color:#111!important;padding:8px 8px!important;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
#room header .title{color:#111!important;font-size:19px!important}
#room header button{color:#111!important;font-size:26px!important}
#room header svg{fill:#111;display:block}
#roomStatus{color:#667781;font-size:12px!important}

#form{background:transparent!important;padding:6px 8px 8px!important;gap:8px;align-items:center}
.bar .pill{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:#fff;border-radius:30px;padding:0 16px;height:50px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bar .pill input[type=text]{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:0;font-size:17px}
.bar .pill .pi{display:flex;width:24px;height:24px;padding:0;flex-shrink:0;cursor:pointer}
.rup{width:22px;height:22px;border:2px solid #5f6b73;border-radius:50%;color:#5f6b73;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar #micBtn,.bar #sendBtn{width:50px;height:50px;border-radius:50%;background:#1fa855!important;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);flex-shrink:0}
.bar #micBtn.hide,.bar #sendBtn.hide{display:none!important}
.wGone{display:none!important}
#msgs.wBlocked .msg:not(.me){display:none!important}
.wgrp .nm::after{display:none!important}
.rup{cursor:pointer}
#chatsList .item:first-child:not(.wgrp) .nm::after{display:inline-block}
#app.dm{filter:invert(1) hue-rotate(180deg)}
#app.dm img,#app.dm video,#app.dm .av,#app.dm #pAv{filter:invert(1) hue-rotate(180deg)}

#main header .title{color:#1fa855!important;font-size:30px!important;font-weight:800;letter-spacing:-1px}
#main header button{padding:0!important;display:flex;align-items:center}
#main header svg{width:30px;height:30px;fill:#111}
.rupC{width:30px;height:30px;border:2.5px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:#111}
#searchWrap{position:relative;padding:10px 18px 12px!important}
#searchBox{background:#f4f3f1!important;padding:15px 20px 15px 54px!important;font-size:17px;border-radius:30px!important;outline:none}
#searchWrap .sIc{position:absolute;left:40px;top:50%;transform:translateY(-50%);width:24px;height:24px;fill:#5f6b73;pointer-events:none}
#app.dm{filter:invert(1) hue-rotate(180deg)}
#app.dm img,#app.dm video,#app.dm .av,#app.dm #pAv{filter:invert(1) hue-rotate(180deg)}
#call #remoteWrap{display:flex!important;flex-direction:column!important;gap:10px!important;padding:calc(env(safe-area-inset-top,0px) + 70px) 12px 110px!important}
#call #remoteWrap #remoteVideo,#call #remoteWrap #localVideo{position:relative!important;inset:auto!important;top:auto!important;left:auto!important;right:auto!important;width:100%!important;max-width:none!important;height:auto!important;flex:1 1 0!important;min-height:0!important;border-radius:24px!important;object-fit:cover!important;border:none!important}

#newChatBtn{position:absolute;right:18px;bottom:92px;width:58px;height:58px;border-radius:18px;background:#25d366;color:#fff;border:none;font-size:32px;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:6;cursor:pointer}

#ncSearch{margin:8px 14px;padding:11px 16px;border:none;border-radius:24px;background:#f0f2f5;font-size:16px;width:calc(100% - 28px)}
</style>

<body>
<div id="app">
<!-- লগইন -->
<div id="login">
  <h1>Friends Chat</h1>
  <button class="lbtn g" id="gBtn">Google দিয়ে ঢোকো</button>
  <button class="lbtn f" id="fBtn">Facebook দিয়ে ঢোকো</button>
  <button class="lbtn p" id="pBtn">মোবাইল নম্বর দিয়ে ঢোকো</button>
  <div id="phoneBox">
    <input id="phoneNum" placeholder="+8801XXXXXXXXX" type="tel">
    <button class="lbtn p" id="sendOtp">কোড পাঠাও</button>
    <input id="otpCode" placeholder="৬ সংখ্যার কোড" class="hide">
    <button class="lbtn p hide" id="verifyOtp">যাচাই করো</button>
    <div id="recaptcha"></div>
  </div>
  <p id="loginErr" style="color:red;font-size:14px;text-align:center"></p>
</div>

<!-- মেইন স্ক্রিন -->
<div id="main" class="hide">
    <header>
    <span class="title">Friends Chat</span>

    <button id="storyCamBtn" title="স্ট্যাটাস"><svg viewBox="0 0 24 24"><path d="M9 2 7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.2L15 2zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
    <button id="mainMenuBtn" title="মেনু"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>

    <button id="logout" class="hide">⎋</button>
  </header>
  <div id="searchWrap">
    <svg class="sIc" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>

  <div id="statusRow"></div>

  <div class="list hide" id="storiesList"></div>

  </div>
</div>

<!-- চ্যাট রুম -->
<div id="room" class="hide">

    <button id="back">←</button>

  <div>
    <div id="roomName"></div>

function avatar(name, photo, ring) {
  const d = document.createElement("div");
  d.className = "av" + (ring ? " storyring" : "");

let chatUsers = [];

function roomIdFor(uid) { return [me.uid, uid].sort().join("_"); }
function lastReadOf(rid) { return Number(localStorage.getItem("lr_" + rid) || 0); }
function msOf(t) { return t && t.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }
function isOnlineUser(u) { const ms = msOf(u.lastSeen); return ms > 0 && Date.now() - ms < 60000; }
function timeLabel(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" });
  const y = new Date(now.getTime() - 86400000);
  if (d.toDateString() === y.toDateString()) return "গতকাল";
  return d.toLocaleDateString("bn-BD");
}

function watchRoom(rid) {
  if (roomUnsub[rid]) return;
  const q = query(collection(db, "rooms", rid, "messages"), orderBy("createdAt", "desc"), limit(30));
  roomUnsub[rid] = onSnapshot(q, (snap) => {
    const roomOpen = !$("room").classList.contains("hide") && currentRoom === rid;
    if (roomOpen) localStorage.setItem("lr_" + rid, String(Date.now()));
    const lr = lastReadOf(rid);
    let unread = 0;
    snap.docs.forEach((d) => {
      const m = d.data();
      const ms = msOf(m.createdAt) || Date.now();
      if (m.uid !== me.uid && ms > lr) unread++;
    });
    const m0 = snap.docs.length ? snap.docs[0].data() : null;
    roomInfo[rid] = m0 ? {
      text: m0.type === "image" ? "📷 ছবি" : m0.type === "voice" ? "🎤 ভয়েস মেসেজ" : (m0.text || ""),
      mine: m0.uid === me.uid,
      who: m0.name || "",
      ts: msOf(m0.createdAt) || Date.now(),
      unread: unread
    } : { text: "", mine: false, who: "", ts: 0, unread: 0 };
    renderChats();
  });
}

function makeRow(o) {
  const inf = o.info;
  const it = document.createElement("div");
  it.className = "item" + (inf.unread > 0 ? " unread" : "");
  const wrap = document.createElement("div");
  wrap.className = "avw";
  wrap.appendChild(avatar(o.name, o.photo));
  if (o.online) { const dot = document.createElement("div"); dot.className = "dot"; wrap.appendChild(dot); }
  const mid = document.createElement("div");
  mid.style.flex = "1";
  mid.style.minWidth = "0";
  const nm = document.createElement("div");
  nm.className = "nm";
  nm.textContent = o.name;
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.style.display = "none";
  const pv = document.createElement("div");
  pv.className = "pv";
  if (inf.text) {
    pv.textContent = (inf.mine ? "তুমি: " : (o.group && inf.who ? inf.who.split(" ")[0] + ": " : "")) + inf.text;
  } else if (o.online) {
    pv.textContent = "● অনলাইন";
    pv.style.color = "#25d366";
  } else {
    pv.textContent = o.group ? "সবাই এখানে" : "চ্যাট করো";
  }
  mid.appendChild(nm);
  mid.appendChild(sub);
  mid.appendChild(pv);
  const meta = document.createElement("div");
  meta.className = "meta";
  const tm = document.createElement("div");
  tm.className = "tm";
  tm.textContent = timeLabel(inf.ts);
  meta.appendChild(tm);
  if (inf.unread > 0) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = inf.unread > 99 ? "99+" : String(inf.unread);
    meta.appendChild(b);
  }
  it.appendChild(wrap);
  it.appendChild(mid);
  it.appendChild(meta);
  it.onclick = o.onclick;
  return it;
}

function renderChats() {
  const box = $("chatsList");
  if (!box || !me) return;
  const empty = { text: "", mine: false, who: "", ts: 0, unread: 0 };
  const rows = chatUsers.map((u) => ({ u: u, rid: roomIdFor(u.uid), online: isOnlineUser(u) }));
  rows.forEach((r) => { r.inf = roomInfo[r.rid] || empty; });
  rows.sort((a, b) =>
    (b.inf.unread > 0) - (a.inf.unread > 0) ||
    (b.online - a.online) ||
    (b.inf.ts - a.inf.ts) ||
    String(a.u.name).localeCompare(String(b.u.name)));
  box.innerHTML = "";
  box.appendChild(makeRow({
    name: "বন্ধুদের গ্রুপ", photo: "", online: false, group: true,
    info: roomInfo["group"] || empty,
    onclick: () => openRoom("group", "বন্ধুদের গ্রুপ", null)
  }));
  rows.forEach((r) => {
    box.appendChild(makeRow({
      name: r.u.name || "বন্ধু", photo: r.u.photo, online: r.online, group: false, info: r.inf,
      onclick: () => openRoom(r.rid, r.u.name, r.u.uid)
    }));
  });
}

function loadChats() {
  if (usersUnsub) usersUnsub();
  Object.keys(roomUnsub).forEach((k) => { roomUnsub[k](); delete roomUnsub[k]; });
  watchRoom("group");
  usersUnsub = onSnapshot(collection(db, "users"), (snap) => {
    chatUsers = [];
    snap.forEach((d) => {
      const u = d.data();
      if (u.uid && u.uid !== me.uid) chatUsers.push(u);
    });
    chatUsers.forEach((u) => watchRoom(roomIdFor(u.uid)));
    renderChats();
  });
  if (!chatTick) chatTick = setInterval(renderChats, 15000);
}

    if (roomInfo[currentRoom]) roomInfo[currentRoom].unread = 0;
    renderChats();
  }
}).observe($("room"), { attributes: true, attributeFilter: ["class"] });

  const img = new Image();
  img.onload = async () => {
    const max = 800;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.6);
    await addDoc(collection(db, "rooms", currentRoom, "messages"), {
      type: "image", url, text: "", uid: me.uid,
      name: me.displayName || me.phoneNumber || "বন্ধু", createdAt: serverTimestamp()
    });
  };
  img.src = URL.createObjectURL(f);
};

  // ===================== কল (WebRTC) =====================
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };
let pc = null, localStream = null, callDocRef = null, callUnsubs = [], isVideoCall = true, inCall = false;

async function getMedia(video) {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = video ? "block" : "none";
}

function makePC() {
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  const remote = new MediaStream();
  $("remoteVideo").srcObject = remote;
  pc.ontrack = (e) => e.streams[0].getTracks().forEach((t) => remote.addTrack(t));
  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === "disconnected" || pc.connectionState === "failed")) endCall(false);
  };
}

async function startCall(video) {
  if (inCall) return;
  inCall = true;
  isVideoCall = video;
  try { await getMedia(video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = $("roomName").textContent + " কে কল করা হচ্ছে...";
  callDocRef = doc(collection(db, "calls"));
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(offerCands, e.candidate.toJSON()); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callDocRef, {
    from: me.uid, fromName: me.displayName || me.phoneNumber || "বন্ধু", to: otherUid,
    video, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, ts: Date.now()
  });
  callUnsubs.push(onSnapshot
    (callDocRef, async (s) => {
    const d = s.data();
    if (!d) return;
    if (d.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      $("callInfo").textContent = "কথা চলছে";
    }
    if (d.status === "ended" || d.status === "rejected") endCall(false);
  }));
  callUnsubs.push(onSnapshot(answerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
}

let incomingCall = null;
function listenIncoming() {
  const q = query(collection(db, "calls"), where("to", "==", me.uid), where("status", "==", "ringing"));
  onSnapshot(q, (snap) => {
    snap.docChanges().forEach((c) => {
      if (c.type === "added" && !inCall) {
        const d = c.doc.data();
        if (Date.now() - d.ts > 60000) return;
        incomingCall = { id: c.doc.id, data: d };
        $("incName").textContent = d.fromName + (d.video ? " ভিডিও কল করছে" : " অডিও কল করছে");
        $("incoming").classList.remove("hide");
      }
    });
  });
}

$("accept").onclick = async () => {
  $("incoming").classList.add("hide");
  const { id, data } = incomingCall;
  inCall = true;
  isVideoCall = data.video;
  try { await getMedia(data.video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = data.fromName;
  callDocRef = doc(db, "calls", id);
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(answerCands, e.candidate.toJSON()); };
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
  callUnsubs.push(onSnapshot(offerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
  callUnsubs.push(onSnapshot(callDocRef, (s) => {
    const d = s.data();
    if (d && d.status === "ended") endCall(false);
  }));
};

$("reject").onclick = async () => {
  $("incoming").classList.add("hide");

};

async function endCall(notify = true) {
  if (notify && callDocRef) { try { await updateDoc(callDocRef, { status: "ended" }); } catch (e) {} }
  callUnsubs.forEach((u) => u());
  callUnsubs = [];
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("call").classList.add("hide");
  $("incoming").classList.add("hide");
  inCall = false;
  callDocRef = null;
}

let sharing = false;
$("shareBtn").onclick = async () => {
  if (!pc) return;
  if (!navigator.mediaDevices.getDisplayMedia) { alert("এই ডিভাইসে স্ক্রিন শেয়ার চলে না"); return; }
  const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
  try {
    if (!sharing) {
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const track = screen.getVideoTracks()[0];
      if (sender) await sender.replaceTrack(track);
      else pc.addTrack(track, screen);
      $("localVideo").srcObject = screen;
      sharing = true;
      track.onended = stopShare;
    } else { stopShare(); }
  } catch (e) {}
};
async function stopShare() {
  sharing = false;
  const cam = localStream && localStream.getVideoTracks()[0];
  const sender = pc && pc.getSenders().find((s) => s.track && s.track.kind === "video");
  if (sender && cam) await sender.replaceTrack(cam);
  $("localVideo").srcObject = localStream;
}

let recorder = null, chunks = [], recTimeout = null;
const mic = $("micBtn");
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      mic.classList.remove("rec");
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 700000) { alert("ভয়েস মেসেজ বেশি বড়, ছোট করে বলো"); return; }
      const reader = new FileReader();
      reader.onloadend = async () => {
        await addDoc(collection(db, "rooms", currentRoom, "messages"), {
          type: "voice", url: reader.result, text: "", uid: me.uid,
          name: me.displayName || me.phoneNumber || "বন্ধু", createdAt: serverTimestamp()
        });
      };
      reader.readAsDataURL(blob);
    };
    recorder.start();
    mic.classList.add("rec");
    recTimeout = setTimeout(stopRec, 20000);
  } catch (e) { alert("মাইকের অনুমতি দাও"); }
}
function stopRec() {
  clearTimeout(recTimeout);
  if (recorder && recorder.state === "recording") recorder.stop();
}
mic.addEventListener("touchstart", (e) => { e.preventDefault(); startRec(); }, { passive: false });
mic.addEventListener("touchend", stopRec);

function lastSeenText(ts) {
  const ms = typeof ts === "number" ? ts : (ts && ts.toMillis ? ts.toMillis() : 0);
  if (!ms) return { online: false, text: "অফলাইন" };
  if (Date.now() - ms < 60000) return { online: true, text: "● অনলাইন" };
  const d = new Date(ms);
  const t = d.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" });
  const same = d.toDateString() === new Date().toDateString();
  const day = same ? "আজ " : d.toLocaleDateString("bn-BD") + " ";
  return { online: false, text: "সর্বশেষ দেখা " + day + t };
}

let statusTimer = null;
function watchStatus(uid) {
  clearInterval(statusTimer);
  const el = $("roomStatus");
  if (!uid) { el.textContent = ""; return; }
  const refresh = async () => {
    const s = await getDoc(doc(db, "users", uid));
    const r = lastSeenText(s.exists() ? s.data().lastSeen : null);
    el.textContent = r.text;
    el.style.color = r.online ? "#34b7f1" : "#d0e0dd";
  };
  refresh();
  statusTimer = setInterval(refresh, 15000);
}
$("back").addEventListener("click", () => clearInterval(statusTimer));
  // ===== সব ফিচার: থ্রি ডট মেনু + কিবোর্ড বার =====
(function () {

  const LS = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const rid = () => currentRoom || "none";
  const ROW = "padding:16px 6px;font-size:17px;border-bottom:1px solid #eee;cursor:pointer;display:flex;align-items:center;gap:12px";

  function toast(m) {
    const t = document.createElement("div");

    t.style.cssText = "position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:80;font-size:15px;text-align:center";

  function panel(title, build) {

    const p = document.createElement("div");

    b.textContent = "←"; b.style.cssText = "font-size:26px;cursor:pointer"; b.onclick = () => p.remove();

    const body = document.createElement("div");
    body.style.cssText = "flex:1;overflow-y:auto;padding:14px 16px";

    build(body, p);
  }

  function choose(title, opts, cur, onPick) {
    panel(title, (body, p) => {
      opts.forEach(([label, val]) => {

        r.style.cssText = ROW;

        r.onclick = () => { p.remove(); onPick(val); };

    });
  }

  function listPanel(title, rows) {
    panel(title, (body, p) => {
      rows.forEach(([label, fn]) => {

  // ---------- রুমের অবস্থা (থিম, ব্লক, ক্লিয়ার, ডিসঅ্যাপিয়ারিং) ----------

  function applyRoomState() {
    const r = rid();
    const c = LS.get("theme_" + r, "");
    roomEl.style.background = c;

    msgs.classList.toggle("wBlocked", blocked());
    const all = Array.from(msgs.querySelectorAll(".msg"));
    const clr = LS.get("clear_" + r, 0);
    const dis = LS.get("dis_" + r, { h: 0, seen: [] });
    for (let i = dis.seen.length; i < all.length; i++) dis.seen.push(Date.now());
    LS.set("dis_" + r, dis);
    all.forEach((m, i) => {
      const gone = i < clr || (dis.h > 0 && Date.now() - dis.seen[i] > dis.h * 3600000);
      m.classList.toggle("wGone", gone);
    });

  function beep() {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value = 880; g.gain.value = 0.1;
      o.start(); o.stop(a.currentTime + 0.15);
    } catch (e) {}
  }
  let lastRoom = null, lastCount = 0;

    applyRoomState();
    const all = msgs.querySelectorAll(".msg"), n = all.length;
    if (currentRoom !== lastRoom) { lastRoom = currentRoom; lastCount = n; return; }
    if (n > lastCount && lastCount > 0) {
      const l = all[n - 1];
      if (l && !l.classList.contains("me") && !isMuted() && !blocked()) beep();
    }
    lastCount = n;
  }).observe(msgs, { childList: true });

  function exportChat() {
    const lines = [];
    msgs.querySelectorAll(".msg").forEach((m) => {
      if (m.classList.contains("wGone")) return;

  // ===== নিজের ছবি ব্যাকগ্রাউন্ড =====
(function () {
  const msgsEl = document.getElementById("msgs");
  const roomEl2 = document.getElementById("room");
  const pick = document.createElement("input");
  pick.type = "file"; pick.accept = "image/*"; pick.style.display = "none";
  document.body.appendChild(pick);
  const key = () => "wall_" + (currentRoom || "none");

  let last = null;
  function apply() {
    let d = "";
    try { d = localStorage.getItem(key()) || ""; } catch (e) {}
    const sig = key() + ":" + d.length;
    if (sig === last) return;
    last = sig;
    msgsEl.style.backgroundImage = d ? 'url("' + d + '")' : "";
    msgsEl.style.backgroundSize = "cover";
    msgsEl.style.backgroundPosition = "center";
    msgsEl.style.backgroundRepeat = "no-repeat";
  }
  setInterval(apply, 700);

  pick.onchange = () => {
    const f = pick.files[0];
    if (!f) return;
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { localStorage.setItem(key(), c.toDataURL("image/jpeg", 0.75)); }
      catch (e) { alert("ছবি সেভ হয়নি, ফোনে জায়গা কম"); }
      URL.revokeObjectURL(url);
      apply();
    };
    img.src = url;
    pick.value = "";
  };

  // Chat theme প্যানেল খুললে দুটো নতুন বাটন যোগ হবে
  new MutationObserver(() => {
    const p = document.getElementById("wPanel");
    if (!p || p.dataset.ph) return;

 // ===== মেইন স্ক্রিনের বাটন =====
(function () {
  const $ = (i) => document.getElementById(i);
  const appEl = $("app");
  const LS = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function toast(m) {
    const t = document.createElement("div");
    t.textContent = m;
    t.style.cssText = "position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:90;font-size:15px;text-align:center";
    appEl.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function panel(title, build) {
    const old = $("mPanel"); if (old) old.remove();
    const p = document.createElement("div");
    p.id = "mPanel";
    p.style.cssText = "position:absolute;inset:0;background:#fff;color:#111;z-index:60;display:flex;flex-direction:column";
    const h = document.createElement("div");
    h.style.cssText = "display:flex;align-items:center;gap:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:19px;font-weight:bold";
    const b = document.createElement("span");
    b.textContent = "←"; b.style.cssText = "font-size:26px;cursor:pointer"; b.onclick = () => p.remove();
    const t = document.createElement("span"); t.textContent = title;
    h.append(b, t);
    const body = document.createElement("div");
    body.style.cssText = "flex:1;overflow-y:auto;padding:14px 16px";
    p.append(h, body);
    appEl.appendChild(p);
    build(body, p);
  }

  const inputCss = "width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:12px";
  const btnCss = "width:100%;padding:14px;margin-top:10px;background:#1fa855;color:#fff;border:none;border-radius:8px;font-size:17px";

  // ---------- ₹ Payments ----------
  $("rupeeBtn").onclick = () => {
    panel("Payments", (body) => {
      const mk = (ph, type) => { const i = document.createElement("input"); i.placeholder = ph; if (type) i.type = type; i.style.cssText = inputCss; return i; };
      const upi = mk("UPI ID (যেমন name@upi)");
      const am = mk("টাকার অঙ্ক", "number");
      const nt = mk("নোট (ঐচ্ছিক)");
      const saved = LS.get("upi_saved", []);
      body.append(upi, am, nt);
      if (saved.length) {
        const lb = document.createElement("div");
        lb.textContent = "আগে পাঠানো:"; lb.style.cssText = "color:#667781;font-size:14px;margin:4px 0 8px";
        body.appendChild(lb);
        saved.forEach((s) => {
          const c = document.createElement("div");
          c.textContent = s;
          c.style.cssText = "display:inline-block;margin:0 8px 8px 0;padding:8px 14px;background:#f0f2f5;border-radius:20px;font-size:15px;cursor:pointer";
          c.onclick = () => { upi.value = s; };
          body.appendChild(c);
        });
      }
      const btn = document.createElement("button");
      btn.textContent = "Pay";
      btn.style.cssText = btnCss;
      btn.onclick = () => {
        const u = upi.value.trim(), a = am.value.trim();
        if (!u || !u.includes("@")) { toast("সঠিক UPI ID লেখো"); return; }
        if (!a || isNaN(a) || Number(a) <= 0) { toast("টাকার অঙ্ক লেখো"); return; }
        LS.set("upi_saved", [u, ...saved.filter((x) => x !== u)].slice(0, 5));
        location.href = "upi://pay?pa=" + encodeURIComponent(u) + "&pn=" + encodeURIComponent(u.split("@")[0]) + "&am=" + encodeURIComponent(a) + "&tn=" + encodeURIComponent(nt.value.trim()) + "&cu=INR";
      };

    });

  // ---------- ক্যামেরা: ছবি তুলে স্টোরিতে ----------
  $("storyCamBtn").onclick = () => {
    const sf = $("storyFile");
    sf.setAttribute("capture", "environment");
    sf.click();
    setTimeout(() => sf.removeAttribute("capture"), 800);
  };

  // ---------- New group ----------
  function newGroup() {
    panel("New group", (body, p) => {
      const name = document.createElement("input");
      name.placeholder = "গ্রুপের নাম"; name.maxLength = 40; name.style.cssText = inputCss;
      const list = document.createElement("div");
      const btn = document.createElement("button");
      btn.textContent = "গ্রুপ বানাও"; btn.style.cssText = btnCss;
      body.append(name, list, btn);
      const picked = new Set();
      getDocs(collection(db, "users")).then((snap) => {
        snap.forEach((d) => {
          const u = d.data();
          if (u.uid === me.uid) return;
          const r = document.createElement("label");
          r.style.cssText = "display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:17px";
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.style.cssText = "width:20px;height:20px";
          cb.onchange = () => { cb.checked ? picked.add(u.uid) : picked.delete(u.uid); };
          const s = document.createElement("span"); s.textContent = u.name || "বন্ধু";
          r.append(cb, s); list.appendChild(r);
        });
      }).catch((e) => { list.textContent = "লোড হয়নি: " + e.message; });
      btn.onclick = async () => {
        const nm = name.value.trim();
        if (!nm) { toast("নাম লেখো"); return; }
        if (!picked.size) { toast("অন্তত একজনকে বাছাই করো"); return; }
        try {
          const ref = await addDoc(collection(db, "groups"), { name: nm, members: [me.uid, ...picked], createdBy: me.uid, createdAt: serverTimestamp() });
          p.remove();
          openRoom("grp_" + ref.id, nm, null);
        } catch (e) {
          alert("গ্রুপ বানানো যায়নি: " + e.message);
        }
      };
    });
  }

  // ---------- ডার্ক মোড ----------
  const setDark = (on) => { appEl.classList.toggle("dm", on); LS.set("darkmode", on); };
  setDark(LS.get("darkmode", false));

  // ---------- ইনস্টল ----------
  let dip = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); dip = e; });
  function installApp() {
    if (window.matchMedia("(display-mode: standalone)").matches) { toast("অ্যাপ আগেই ইনস্টল করা আছে"); return; }
    if (dip) { dip.prompt(); dip = null; return; }
    alert("Chrome-এর ⋮ মেনু খুলে 'Add to Home screen' বা 'Install app' চাপো");
  }

  // ---------- আমন্ত্রণ ----------
  function invite() {
    const url = location.origin + location.pathname;
    if (navigator.share) {
      navigator.share({ title: "Friends Chat", text: "আমার সাথে Friends Chat-এ চ্যাট করো", url }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => toast("লিংক কপি হয়েছে"));
    } else {
      prompt("এই লিংক বন্ধুকে পাঠাও", url);
    }
  }

  // ---------- থ্রি ডট মেনু ----------
  const menu = document.createElement("div");
  menu.style.cssText = "display:none;position:absolute;top:62px;right:12px;background:#fff;color:#111;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:50;min-width:230px;padding:6px 0";
  $("main").appendChild(menu);
  function buildMenu() {
    menu.innerHTML = "";
    const items = [
      ["New group", newGroup],
      ["Invite friends", invite],
      [appEl.classList.contains("dm") ? "Light mode" : "Dark mode", () => setDark(!appEl.classList.contains("dm"))],
      ["Install app", installApp],
      ["প্রোফাইল", () => $("myProfile").click()],
      ["Logout", () => { if (confirm("Logout করবে?")) signOut(auth); }]
    ];
    items.forEach(([label, fn]) => {
      const d = document.createElement("div");
      d.textContent = label;
      d.style.cssText = "padding:16px 22px;font-size:17px;cursor:pointer";
      d.onclick = () => { menu.style.display = "none"; fn(); };
      menu.appendChild(d);
    });
  }
  $("mainMenuBtn").onclick = (e) => {
    e.stopPropagation();
    if (menu.style.display === "block") { menu.style.display = "none"; return; }
    buildMenu(); menu.style.display = "block";
  };
  document.addEventListener("click", () => { menu.style.display = "none"; });
})();

(function () {
  const wrap = $("remoteWrap");
  const cbar = document.querySelector("#call .cbar");

  const top = document.createElement("div");
  top.id = "callTop";
  const nm = document.createElement("div");
  nm.id = "callName";
  const st = document.createElement("div");
  st.id = "callStatus";
  top.appendChild(nm);
  top.appendChild(st);
  wrap.appendChild(top);

  const face = document.createElement("div");
  face.id = "audioFace";
  const av = document.createElement("div");
  av.id = "audioAv";
  face.appendChild(av);
  wrap.appendChild(face);

  const flip = document.createElement("button");
  flip.id = "flipBtn";
  flip.textContent = "🔄";
  cbar.insertBefore(flip, $("endBtn"));

  let lastName = "";
  new MutationObserver(() => {
    const t = ($("callInfo").textContent || "").trim();
    if (t && t !== "কথা চলছে") lastName = t.replace(" কে কল করা হচ্ছে...", "");
  }).observe($("callInfo"), { childList: true, characterData: true, subtree: true });

  let connectedAt = 0;
  setInterval(() => {
    if ($("call").classList.contains("hide")) { connectedAt = 0; return; }
    nm.textContent = lastName;
    av.textContent = (lastName || "?")[0].toUpperCase();
    face.classList.toggle("on", !isVideoCall);
    $("camBtn").style.display = isVideoCall ? "" : "none";
    $("shareBtn").style.display = isVideoCall ? "" : "none";
    flip.style.display = isVideoCall ? "" : "none";
    const live = pc && (pc.connectionState === "connected" || pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed");
    if (live && !connectedAt) connectedAt = Date.now();
    if (connectedAt) {
      const s = Math.floor((Date.now() - connectedAt) / 1000);
      st.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    } else {
      st.textContent = "কল হচ্ছে...";
    }
  }, 500);

  let facing = "user";
  flip.onclick = async () => {
    if (!localStream || !pc) return;
    facing = facing === "user" ? "environment" : "user";
    try {
      const old = localStream.getVideoTracks()[0];
      if (old) { localStream.removeTrack(old); old.stop(); }
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      const nt = s.getVideoTracks()[0];
      const sender = pc.getSenders().find((x) => x.track === null || (x.track && x.track.kind === "video"));
      if (sender) await sender.replaceTrack(nt);
      localStream.addTrack(nt);
      $("localVideo").srcObject = localStream;
      $("localVideo").style.transform = facing === "user" ? "scaleX(-1)" : "none";
    } catch (e) { alert("ক্যামেরা বদলানো যায়নি"); }
  };

  const lv = $("localVideo");
  let dx = 0, dy = 0, drag = false;
  lv.addEventListener("touchstart", (e) => {
    const t = e.touches[0], r = lv.getBoundingClientRect();
    dx = t.clientX - r.left; dy = t.clientY - r.top; drag = true;
  }, { passive: true });
  lv.addEventListener("touchmove", (e) => {
    if (!drag) return;
    const t = e.touches[0], pr = wrap.getBoundingClientRect();
    lv.style.setProperty("left", (t.clientX - dx - pr.left) + "px", "important");
    lv.style.setProperty("top", (t.clientY - dy - pr.top) + "px", "important");
    lv.style.setProperty("right", "auto", "important");
  }, { passive: true });
  lv.addEventListener("touchend", () => { drag = false; });

  let ringCtx = null, ringTimer = null;
  function ringOnce() {
    try {
      ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.frequency.value = 480; g.gain.value = 0.15;
      o.connect(g); g.connect(ringCtx.destination);
      o.start(); o.stop(ringCtx.currentTime + 0.4);
    } catch (e) {}
  }
  function stopRing() { clearInterval(ringTimer); ringTimer = null; if (navigator.vibrate) navigator.vibrate(0); }
  function startRing() { stopRing(); ringOnce(); ringTimer = setInterval(ringOnce, 1500); if (navigator.vibrate) navigator.vibrate([400, 200, 400]); }
  new MutationObserver(() => {
    if ($("incoming").classList.contains("hide")) stopRing(); else startRing();
  }).observe($("incoming"), { attributes: true, attributeFilter: ["class"] });
})();
  // ===== কলারের রিং (রিংব্যাক) =====
(function () {
  let ctx = null, t = null;
  function getCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  ["click", "touchstart"].forEach((ev) => document.addEventListener(ev, getCtx, { passive: true }));
  function beep(at, dur) {
    const c = getCtx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 425; g.gain.value = 0.12;
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + at); o.stop(c.currentTime + at + dur);
  }
  function pattern() { beep(0, 0.4); beep(0.6, 0.4); }
  setInterval(() => {
    const calling = !$("call").classList.contains("hide") && ($("callInfo").textContent || "").includes("কল করা হচ্ছে");
    if (calling && !t) { pattern(); t = setInterval(pattern, 3000); }
    if (!calling && t) { clearInterval(t); t = null; }
  }, 400);
})();

// ===== নোটিফিকেশন (অ্যাপ ব্যাকগ্রাউন্ডে থাকলে) =====
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("click", () => {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}, { once: true });

async function notify(title, body, tag) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, { body: body, tag: tag, renotify: true, vibrate: [300, 150, 300], requireInteraction: tag === "call" });
  } catch (e) {}
}

new MutationObserver(() => {
  if (!$("incoming").classList.contains("hide") && document.hidden) {
    notify("📞 " + ($("incName").textContent || "ইনকামিং কল"), "কল ধরতে এখানে ট্যাপ করো", "call");
  }
}).observe($("incoming"), { attributes: true, attributeFilter: ["class"] });

let lastCount = 0, lastRoom = null, deb = null;
new MutationObserver(() => {
  clearTimeout(deb);
  deb = setTimeout(() => {
    const els = Array.from(document.querySelectorAll("#msgs .msg:not(.me)"));
    if (lastRoom === currentRoom && els.length > lastCount && document.hidden) {
      notify("💬 নতুন মেসেজ", els[els.length - 1].textContent.slice(0, 80), "msg");
    }
    lastRoom = currentRoom; lastCount = els.length;
  }, 300);
}).observe($("msgs"), { childList: true });

(function () {
  const fab = document.createElement("button");
  fab.id = "newChatBtn";
  fab.textContent = "＋";
  $("main").appendChild(fab);

  function syncFab() { fab.style.display = $("chatsList").classList.contains("hide") ? "none" : "block"; }
  new MutationObserver(syncFab).observe($("chatsList"), { attributes: true, attributeFilter: ["class"] });
  syncFab();

  function ms(t) { return t && t.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }

  fab.onclick = async () => {
    if (document.getElementById("newChat")) return;
    const panel = document.createElement("div");
    panel.id = "newChat";
    const head = document.createElement("header");
    const back = document.createElement("button");
    back.textContent = "←";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "চ্যাট শুরু করো";
    head.appendChild(back);
    head.appendChild(title);
    const search = document.createElement("input");
    search.id = "ncSearch";
    search.placeholder = "বন্ধু খোঁজো...";
    const list = document.createElement("div");
    list.className = "ncList";
    panel.appendChild(head);
    panel.appendChild(search);
    panel.appendChild(list);
    $("app").appendChild(panel);
    back.onclick = () => panel.remove();
    list.textContent = "লোড হচ্ছে...";

    const users = [];
    try {
      const snap = await getDocs(collection(db, "users"));
      snap.forEach((d) => { const u = d.data(); if (u.uid && u.uid !== me.uid) users.push(u); });
    } catch (e) { list.textContent = "বন্ধুদের তালিকা আনা যায়নি"; return; }
    users.sort((a, b) => ms(b.lastSeen) - ms(a.lastSeen));

    function draw() {
      const q = search.value.trim().toLowerCase();
      list.textContent = "";
      const inv = $("inviteBtn");
      if (inv && !q) {
        const r = document.createElement("div");
        r.className = "item";
        const ic = document.createElement("div");
        ic.className = "av";
        ic.style.background = "#25d366";
        ic.textContent = "🔗";
        const t = document.createElement("div");
        t.className = "nm";
        t.textContent = "বন্ধুদের ইনভাইট করো";
        r.appendChild(ic);
        r.appendChild(t);
        r.onclick = () => { panel.remove(); inv.click(); };
        list.appendChild(r);
      }
      const shown = users.filter((u) => !q || String(u.name || "").toLowerCase().includes(q));
      if (!shown.length) {
        const p = document.createElement("div");
        p.className = "soon";
        p.textContent = "কাউকে পাওয়া যায়নি। বন্ধুকে ইনভাইট করো।";
        list.appendChild(p);
        return;
      }
      shown.forEach((u) => {
        const r = document.createElement("div");
        r.className = "item";
        r.appendChild(avatar(u.name, u.photo));
        const box = document.createElement("div");
        const nm = document.createElement("div");
        nm.className = "nm";
        nm.textContent = u.name || "বন্ধু";
        const sub = document.createElement("div");
        sub.className = "sub";
        const on = ms(u.lastSeen) > 0 && Date.now() - ms(u.lastSeen) < 60000;
        sub.textContent = u.bio ? u.bio : (on ? "● অনলাইন" : "চ্যাট করো");
        if (!u.bio && on) sub.style.color = "#25d366";
        box.appendChild(nm);
        box.appendChild(sub);
        r.appendChild(box);
        r.onclick = () => { panel.remove(); openRoom([me.uid, u.uid].sort().join("_"), u.name, u.uid); };
        list.appendChild(r);
      });
    }
    search.oninput = draw;
    draw();
  };
})();
