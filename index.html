<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Friends Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#111;height:100dvh;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:520px;height:100dvh;background:#efeae2;display:flex;flex-direction:column;position:relative}
.hide{display:none!important}
header{background:#075e54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header .title{flex:1;font-size:18px;font-weight:bold}
header button,.ibtn{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
#login{flex:1;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px}
#login h1{color:#075e54}
.lbtn{width:100%;max-width:300px;padding:13px;border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer}
.g{background:#db4437}.f{background:#1877f2}.p{background:#25d366}
#phoneBox{display:none;flex-direction:column;gap:8px;width:100%;max-width:300px}
#phoneBox input{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;background:#075e54}
.tab{flex:1;text-align:center;padding:12px;color:#b8d8d3;cursor:pointer;font-weight:bold;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:#fff}
.list{flex:1;overflow-y:auto;background:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:#bbb center/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.item .nm{font-weight:bold}.item .sub{font-size:13px;color:#777}
.storyring{border:3px solid #25d366}
#room{position:absolute;inset:0;background:#efeae2;display:flex;flex-direction:column;z-index:5}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.msg{max-width:78%;padding:7px 9px;border-radius:8px;background:#fff;align-self:flex-start;word-wrap:break-word}
.msg.me{background:#dcf8c6;align-self:flex-end}
.msg .n{font-size:12px;color:#075e54;font-weight:bold}
.msg .t{font-size:10px;color:#888;text-align:right;margin-top:2px}
.msg img,.msg video{max-width:100%;border-radius:6px;display:block}
.bar{display:flex;gap:6px;padding:8px;background:#f0f0f0;align-items:center}
.bar input[type=text]{flex:1;padding:11px;border:none;border-radius:20px;font-size:16px}
.bar button{background:#075e54;color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.bar label{font-size:24px;cursor:pointer;padding:0 4px}
#call{position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
#remoteWrap{flex:1;position:relative;background:#222}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;right:10px;top:10px;width:110px;border-radius:8px;border:2px solid #fff;background:#444}
#callInfo{position:absolute;top:12px;left:12px;color:#fff;font-size:18px}
.cbar{display:flex;justify-content:center;gap:16px;padding:16px;background:#111}
.cbar button{width:54px;height:54px;border-radius:50%;border:none;font-size:22px;cursor:pointer;background:#444;color:#fff}
.cbar .end{background:#e53935}
#incoming{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;color:#fff;font-size:22px}
#incoming .row{display:flex;gap:30px}
#incoming button{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;cursor:pointer}
#viewer{position:absolute;inset:0;background:#000;z-index:15;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
#viewer img,#viewer video{max-width:100%;max-height:80%}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#room{height:100dvh}
 #inviteBtn{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:#fff}
#inviteBtn .ic{width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#inviteBtn .invT{font-weight:bold;font-size:17px}
#inviteBtn .invS{font-size:14px;color:#667781} 
  #form{padding-bottom:60px!important}
  #form{padding-bottom:8px!important}
.bar{position:relative}
#bottomNav{padding-bottom:60px!important}
  .item .nm::after,.msg .n::after,#roomName.vb::after{content:"✔";display:inline-block;width:15px;height:15px;line-height:15px;font-size:10px;text-align:center;color:#fff;background:#1d9bf0;border-radius:50%;margin-left:5px;vertical-align:middle}
#chatsList .item:first-child .nm::after{display:none}
#profile{position:absolute;inset:0;height:100dvh;background:#fff;z-index:8;display:flex;flex-direction:column}
#profile .body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
#pAv{width:130px;height:130px;border-radius:50%;background:#075e54 center/cover;color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#profile input,#profile textarea{width:100%;max-width:360px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#profile label.l{align-self:flex-start;max-width:360px;width:100%;color:#075e54;font-size:13px;font-weight:bold;margin:0 auto}
#saveProfile{width:100%;max-width:360px;padding:13px;background:#25d366;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
/* ===== WhatsApp look ===== */
header{background:#fff!important;color:#111!important;padding:14px 16px!important}
header .title{color:#128c7e!important;font-size:24px!important;font-weight:bold}
header button,.ibtn{color:#111!important}

#bottomNav{display:flex;background:#fff;border-top:1px solid #e5e5e5;padding:6px 0 10px}

.soon{padding:40px 20px;text-align:center;color:#667781;font-size:16px}
#statusRow{display:flex;gap:14px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0}
.stc{text-align:center;font-size:12px;color:#444;flex-shrink:0;cursor:pointer}
.stc .av{margin:0 auto 4px}
#delBar{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:30;padding:14px;display:flex;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#delBar button{flex:1;padding:13px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.tick{font-size:12px;color:#8696a0;margin-left:4px}
.tick.read{color:#34b7f1}
.dot{width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid #fff;position:absolute;right:0;bottom:0}
.avw{position:relative;flex-shrink:0}
#typing{padding:2px 14px;font-size:13px;color:#667781;background:#efeae2;min-height:20px}
.reply{background:rgba(0,0,0,.06);border-left:4px solid #25d366;border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:13px;color:#555}
.react{position:absolute;bottom:-12px;right:6px;background:#fff;border-radius:12px;padding:1px 6px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.msg{position:relative}
#replyBar{display:none;background:#f0f0f0;padding:6px 12px;border-left:4px solid #25d366;font-size:13px;justify-content:space-between}
#emojiBar{position:absolute;left:10px;right:10px;bottom:70px;background:#fff;border-radius:30px;padding:10px;display:flex;justify-content:space-around;font-size:26px;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#actBar{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:31;padding:10px;display:flex;gap:8px;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#actBar button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;background:#f0f0f0}
.voice audio{height:36px;max-width:220px}
#micBtn.rec{background:#e53935!important}
.bar{background:transparent!important}
.bar .pill{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:4px 14px}
.bar .pill input[type=text]{flex:1;background:transparent;padding:10px 4px}
.bar .pill .pic{padding:0;display:flex}
.bar button{width:48px;height:48px;background:#1fa855}
#header button svg{display:block}
#room header{align-items:center}
.bar #sendBtn.hide{display:none!important}
</style>
</head>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signOut, onAuthStateChanged, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, setDoc, doc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ====== এখানে তোমার firebaseConfig বসাও ======
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD40E1QifHt5xQU935KOtfzi1wORCgvJrk",
  authDomain: "friendschat-8a7fc.firebaseapp.com",
  projectId: "friendschat-8a7fc",
  storageBucket: "friendschat-8a7fc.firebasestorage.app",
  messagingSenderId: "14697970142",
  appId: "1:14697970142:web:137bb152271d8bd7fc454f",
  measurementId: "G-4YHFYRRCJG"
};
// ==============================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const $ = (id) => document.getElementById(id);
let me = null;
let currentRoom = null;
let unsubMsgs = null;
let otherUid = null;

// ---------- লগইন ----------
const showErr = (e) => { $("loginErr").textContent = e.message || String(e); };
$("gBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(showErr);
$("fBtn").onclick = () => signInWithPopup(auth, new FacebookAuthProvider()).catch(showErr);
$("pBtn").onclick = () => { $("phoneBox").style.display = "flex"; };

let confirmation = null;
$("sendOtp").onclick = async () => {
  try {
    if (!window.rv) window.rv = new RecaptchaVerifier(auth, "recaptcha", { size: "normal" });
    confirmation = await signInWithPhoneNumber(auth, $("phoneNum").value.trim(), window.rv);
    $("otpCode").classList.remove("hide");
    $("verifyOtp").classList.remove("hide");
  } catch (e) { showErr(e); }
};
$("verifyOtp").onclick = () => confirmation.confirm($("otpCode").value.trim()).catch(showErr);
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  me = user;
  if (user) {
    const name = user.displayName || user.phoneNumber || "বন্ধু";
    await setDoc(doc(db, "users", user.uid), { uid: user.uid, name, photo: user.photoURL || "", lastSeen: serverTimestamp() }, { merge: true });
    $("login").classList.add("hide");
    $("main").classList.remove("hide");
    loadChats();
    loadStories();
    listenIncoming();
  } else {
    $("login").classList.remove("hide");
    $("main").classList.add("hide");
    $("room").classList.add("hide");
  }
});

// ---------- ট্যাব ----------
document.querySelectorAll(".tab").forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    t.classList.add("on");
    const isStory = t.dataset.t === "stories";
    $("chatsList").classList.toggle("hide", isStory);
    $("storiesList").classList.toggle("hide", !isStory);
    $("addStory").classList.toggle("hide", !isStory);
  };
});

function avatar(name, photo, ring) {
  const d = document.createElement("div");
  d.className = "av" + (ring ? " storyring" : "");
  if (photo) d.style.backgroundImage = `url(${photo})`;
  else { d.textContent = (name || "?")[0].toUpperCase(); d.style.background = "#075e54"; }
  return d;
}

// ---------- চ্যাট তালিকা ----------
function loadChats() {
  onSnapshot(collection(db, "users"), (snap) => {
    const box = $("chatsList");
    box.innerHTML = "";
    const g = document.createElement("div");
    g.className = "item";
    g.appendChild(avatar("গ", ""));
    g.insertAdjacentHTML("beforeend", '<div><div class="nm">বন্ধুদের গ্রুপ</div><div class="sub">সবাই এখানে</div></div>');

  // ===================== কল (WebRTC) =====================
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };
let pc = null, localStream = null, callDocRef = null, callUnsubs = [], isVideoCall = true, inCall = false;

async function getMedia(video) {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = video ? "block" : "none";
}

function makePC() {
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  const remote = new MediaStream();
  $("remoteVideo").srcObject = remote;
  pc.ontrack = (e) => e.streams[0].getTracks().forEach((t) => remote.addTrack(t));
  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === "disconnected" || pc.connectionState === "failed")) endCall(false);
  };
}

async function startCall(video) {
  if (inCall) return;
  inCall = true;
  isVideoCall = video;
  try { await getMedia(video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = $("roomName").textContent + " কে কল করা হচ্ছে...";
  callDocRef = doc(collection(db, "calls"));
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(offerCands, e.candidate.toJSON()); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callDocRef, {
    from: me.uid, fromName: me.displayName || me.phoneNumber || "বন্ধু", to: otherUid,
    video, status: "ringing", offer: { type: offer.type, sdp: offer.sdp }, ts: Date.now()
  });
  push(
    (callDocRef, async (s) => {
    const d = s.data();
    if (!d) return;
    if (d.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      $("callInfo").textContent = "কথা চলছে";
    }
    if (d.status === "ended" || d.status === "rejected") endCall(false);
  }));
  callUnsubs.push(onSnapshot(answerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
}

let incomingCall = null;
function listenIncoming() {callUnsubs
  const q = query(collection(db, "calls"), where("to", "==", me.uid), where("status", "==", "ringing"));
  onSnapshot(q, (snap) => {
    snap.docChanges().forEach((c) => {
      if (c.type === "added" && !inCall) {
        const d = c.doc.data();
        if (Date.now() - d.ts > 60000) return;
        incomingCall = { id: c.doc.id, data: d };
        $("incName").textContent = d.fromName + (d.video ? " ভিডিও কল করছে" : " অডিও কল করছে");
        $("incoming").classList.remove("hide");
      }
    });
  });
}

$("accept").onclick = async () => {
  $("incoming").classList.add("hide");
  const { id, data } = incomingCall;
  inCall = true;
  isVideoCall = data.video;
  try { await getMedia(data.video); } catch (e) { alert("ক্যামেরা/মাইক্রোফোনের অনুমতি দাও"); inCall = false; return; }
  makePC();
  $("call").classList.remove("hide");
  $("callInfo").textContent = data.fromName;
  callDocRef = doc(db, "calls", id);
  const offerCands = collection(callDocRef, "offerCandidates");
  const answerCands = collection(callDocRef, "answerCandidates");
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(answerCands, e.candidate.toJSON()); };
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
  callUnsubs.push(onSnapshot(offerCands, (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
  callUnsubs.push(onSnapshot(callDocRef, (s) => {
    const d = s.data();
    if (d && d.status === "ended") endCall(false);
  }));
};

async function endCall(notify = true) {
  if (notify && callDocRef) { try { await updateDoc(callDocRef, { status: "ended" }); } catch (e) {} }
  callUnsubs.forEach((u) => u());
  callUnsubs = [];
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("call").classList.add("hide");
  $("incoming").classList.add("hide");
  inCall = false;
  callDocRef = null;
}

let sharing = false;
$("shareBtn").onclick = async () => {
  if (!pc) return;
  if (!navigator.mediaDevices.getDisplayMedia) { alert("এই ডিভাইসে স্ক্রিন শেয়ার চলে না"); return; }
  const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
  try {
    if (!sharing) {
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const track = screen.getVideoTracks()[0];
      if (sender) await sender.replaceTrack(track);
      else pc.addTrack(track, screen);
      $("localVideo").srcObject = screen;
      sharing = true;
      track.onended = stopShare;
    } else { stopShare(); }
  } catch (e) {}
};
async function stopShare() {
  sharing = false;
  const cam = localStream && localStream.getVideoTracks()[0];
  const sender = pc && pc.getSenders().find((s) => s.track && s.track.kind === "video");
  if (sender && cam) await sender.replaceTrack(cam);
  $("localVideo").srcObject = localStream;
}

  snap.forEach((d) => { const u = d.data(); online[u.name] = isOnline(u); });
  items.forEach((it) => {
    const nm = it.querySelector(".nm");
    const sub = it.querySelector(".sub");
    if (nm && sub && online[nm.textContent] !== undefined) {
      sub.textContent = online[nm.textContent] ? "অনলাইন" : "অফলাইন";
      sub.style.color = online[nm.textContent] ? "#25d366" : "#667781";
    }
  });
});

// ===== টাইপ করছে =====
let typingTimer = null;
$("txt").addEventListener("input", () => {
  if (!currentRoom || !me) return;
  setDoc(doc(db, "typing", currentRoom + "_" + me.uid), { room: currentRoom, uid: me.uid, name: me.displayName || "বন্ধু", ts: Date.now() });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => setDoc(doc(db, "typing", currentRoom + "_" + me.uid), { room: currentRoom, uid: me.uid, name: "", ts: 0 }), 2500);
});
onSnapshot(collection(db, "typing"), (snap) => {
  let who = "";
  snap.forEach((d) => {
    const t = d.data();
    if (t.room === currentRoom && t.uid !== (me && me.uid) && Date.now() - t.ts < 4000 && t.name) who = t.name + " টাইপ করছে...";
  });
  if ($("typing")) $("typing").textContent = who;
});

// ===== পড়া হয়েছে (ডাবল টিক) =====
async function markRead(snap) {
  snap.forEach((d) => {
    const m = d.data();
    if (m.uid !== me.uid && !m.read && currentRoom !== "group") {
      updateDoc(doc(db, "rooms", currentRoom, "messages", d.id), { read: true });
    }
  });
}
function tickEl(m) {
  const s = document.createElement("span");
  s.className = "tick" + (m.read ? " read" : "");
  s.textContent = m.read ? "✓✓" : "✓";
  return s;
}
// ===== মেসেজে চেপে ধরলে মেনু: রিপ্লাই / রিঅ্যাকশন / ডিলিট =====
let replyTo = null;
function openActions(m, msgId, el) {
  if (document.getElementById("actBar")) return;
  const bar = document.createElement("div");
  bar.id = "actBar";
  const emojis = document.createElement("div");
  emojis.id = "emojiBar";
  ["👍", "❤️", "😂", "😮", "😢", "🙏"].forEach((em) => {
    const s = document.createElement("span");
    s.textContent = em;
    s.onclick = async () => {
      await updateDoc(doc(db, "rooms", currentRoom, "messages", msgId), { react: em });
      close();
    };
    emojis.appendChild(s);
  });
  const rep = document.createElement("button");
  rep.textContent = "রিপ্লাই";
  rep.onclick = () => {
    replyTo = { name: m.name, text: m.text || (m.type === "image" ? "📷 ছবি" : "🎤 ভয়েস") };
    $("replyText").textContent = replyTo.name + ": " + replyTo.text;
    $("replyBar").style.display = "flex";
    $("txt").focus();
    close();
  };
  const del = document.createElement("button");
  del.textContent = "ডিলিট";
  del.style.color = "#e53935";
  del.onclick = async () => {
    await deleteDoc(doc(db, "rooms", currentRoom, "messages", msgId));
    close();
  };
  const no = document.createElement("button");
  no.textContent = "বন্ধ";
  no.onclick = () => close();
  bar.appendChild(rep);
  if (m.uid === me.uid) bar.appendChild(del);
  bar.appendChild(no);
  function close() { bar.remove(); emojis.remove(); }
  $("room").appendChild(emojis);
  $("room").appendChild(bar);
}
$("replyX").onclick = () => { replyTo = null; $("replyBar").style.display = "none"; };

// ===== ভয়েস মেসেজ (মাইক চেপে ধরো, ছাড়লে চলে যাবে, সর্বোচ্চ ২০ সেকেন্ড) =====
let recorder = null, chunks = [], recTimeout = null;
const mic = $("micBtn");
async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      mic.classList.remove("rec");
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size > 700000) { alert("ভয়েস মেসেজ বেশি বড়, ছোট করে বলো"); return; }
      const reader = new FileReader();
      reader.onloadend = async () => {
        await addDoc(collection(db, "rooms", currentRoom, "messages"), {
          type: "voice", url: reader.result, text: "", uid: me.uid,
          name: me.displayName || me.phoneNumber || "বন্ধু", createdAt: serverTimestamp()
        });
      };
      reader.readAsDataURL(blob);
    };
    recorder.start();
    mic.classList.add("rec");
    recTimeout = setTimeout(stopRec, 20000);
  } catch (e) { alert("মাইকের অনুমতি দাও"); }
}
function stopRec() {
  clearTimeout(recTimeout);
  if (recorder && recorder.state === "recording") recorder.stop();
}
mic.addEventListener("touchstart", (e) => { e.preventDefault(); startRec(); }, { passive: false });
mic.addEventListener("touchend", stopRec);
mic.addEventListener("mousedown", startRec);
mic.addEventListener("mouseup", stopRec);
// ===== বন্ধুদের ইনভাইট =====
(function () {
  const list = $("chatsList");
  const row = document.createElement("div");
  row.id = "inviteBtn";
  const ic = document.createElement("div");
  ic.className = "ic";
  ic.textContent = "🔗";
  const box = document.createElement("div");
  const t1 = document.createElement("div");
  t1.className = "invT";
  t1.textContent = "বন্ধুদের ইনভাইট করো";
  const t2 = document.createElement("div");
  t2.className = "invS";
  t2.textContent = "লিংক পাঠিয়ে বন্ধুকে ডেকে আনো";
  box.appendChild(t1);
  box.appendChild(t2);
  row.appendChild(ic);
  row.appendChild(box);
  row.onclick = async () => {
    const text = "চলো Friends Chat এ কথা বলি! লিংকটা ক্রোম ব্রাউজারে খুলে Google দিয়ে ঢোকো: " + location.origin;
    try {
      if (navigator.share) { await navigator.share({ title: "Friends Chat", text: text }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      await navigator.clipboard.writeText(text);
      alert("লিংক কপি হয়েছে, বন্ধুকে পাঠিয়ে দাও");
    } catch (e) {
      prompt("এই লেখাটা কপি করে বন্ধুকে পাঠাও:", text);
    }
  };
  const keep = () => { if (list.lastChild !== row) list.appendChild(row); };
  new MutationObserver(keep).observe(list, { childList: true });
  keep();
})();
// ===== অনলাইন / সর্বশেষ দেখা =====
setInterval(() => {
  if (me && !document.hidden) setDoc(doc(db, "users", me.uid), { lastSeen: Date.now() }, { merge: true });
}, 20000);

function lastSeenText(ts) {
  const ms = typeof ts === "number" ? ts : (ts && ts.toMillis ? ts.toMillis() : 0);
  if (!ms) return { online: false, text: "অফলাইন" };
  if (Date.now() - ms < 60000) return { online: true, text: "● অনলাইন" };
  const d = new Date(ms);
  const t = d.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" });
  const same = d.toDateString() === new Date().toDateString();
  const day = same ? "আজ " : d.toLocaleDateString("bn-BD") + " ";
  return { online: false, text: "সর্বশেষ দেখা " + day + t };
}

let statusTimer = null;
function watchStatus(uid) {
  clearInterval(statusTimer);
  const el = $("roomStatus");
  if (!uid) { el.textContent = ""; return; }
  const refresh = async () => {
    const s = await getDoc(doc(db, "users", uid));
    const r = lastSeenText(s.exists() ? s.data().lastSeen : null);
    el.textContent = r.text;
    el.style.color = r.online ? "#34b7f1" : "#d0e0dd";
  };
  refresh();
  statusTimer = setInterval(refresh, 15000);
}
$("back").addEventListener("click", () => clearInterval(statusTimer));
